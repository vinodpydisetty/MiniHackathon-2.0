<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Trivia Battle Game</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Trivia Battle Game</h1>
  
    <div id="playerNames">
      <p>Players' Names</p>
      <input type="text" id="playerOne" placeholder="Enter Player1's Name" /><br>
      <input type="text" id="playerTwo" placeholder="Enter Player2's Name" /><br>
      <button type="button" onclick="startTheGame()">Start Game</button>
    </div>

    <div id="categoryContainer" style="display: none">
      <select id="categorySelection">
      </select><br>
      <button type="button" onclick="fetchQuestions()">Display Questions</button>
    </div>

    <div id="questionsContainer" style="display: none">
    </div>

    <script src="script.js"></script>
  </body>
</html>
